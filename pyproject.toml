[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "examples/",
  "research_agent/inno/",
  "benchmark/",
]

[tool.ruff.lint]
# TODO(feature/new-ui): tighten ignores after codebase is cleaned
ignore = [
  "E402", # module import not at top of file
  "E722", # bare except
  "E721", # type comparison
  "E741", # ambiguous variable name
  "F401", # imported but unused (temporary for large modules)
  "F811", # redefinition
  "F821", # undefined name
  "F841", # assigned but unused
  "F403", # star import used
]
